<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse - Мессенджер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message-bubble { animation: fadeIn 0.2s ease-out forwards; }
        
        .recording-pulse { animation: pulse 1.2s infinite; color: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
        
        @media (max-width: 768px) { 
            .sidebar-open { transform: translateX(0); } 
            .sidebar-closed { transform: translateX(-100%); } 
        }
        
        #local-video { transform: scaleX(-1); border-radius: 1.5rem; object-fit: cover; }
        #remote-video { border-radius: 2rem; object-fit: cover; }

        .video-blur { filter: blur(25px) brightness(0.6); }
        .video-studio { filter: contrast(1.1) saturate(1.2) brightness(1.1); }

        #messages-container {
            background-color: #e5e5ea;
            background-image: url("https://www.transparenttextures.com/patterns/subtle-dots.png");
        }

        aside {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
        }

        .call-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }
        
        .bg-gradient-default {
            background: linear-gradient(45deg, #020617, #1e1b4b, #312e81, #020617);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 5;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="text-slate-800">

<div id="app" class="flex h-screen w-full relative bg-slate-100 overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 h-full border-r border-slate-200 flex flex-col absolute md:relative z-40 transition-transform duration-300 ease-in-out sidebar-open md:transform-none shadow-2xl">
        <!-- Header -->
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white">
            <div class="flex items-center gap-3">
                <div class="relative cursor-pointer" onclick="showSettingsModal()">
                    <img src="https://ui-avatars.com/api/?name=User" id="my-avatar" class="w-10 h-10 rounded-2xl object-cover shadow-sm ring-2 ring-indigo-50">
                    <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-4 border-white rounded-full"></span>
                </div>
                <div class="min-w-0">
                    <h2 class="font-black text-sm truncate" id="my-name">Загрузка...</h2>
                    <p class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest">Pulse App</p>
                </div>
            </div>
            <div class="flex gap-1">
                <button title="Новый чат" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" onclick="showNewChatModal()"><i class="fas fa-plus"></i></button>
                <button title="Настройки" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" onclick="showSettingsModal()"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- Search -->
        <div class="p-3 bg-slate-50/50">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-contacts" oninput="renderChatList(this.value)" placeholder="Поиск сообщений..." class="w-full py-2.5 pl-10 pr-4 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/10 transition-all shadow-sm">
            </div>
        </div>

        <!-- Chat List -->
        <div class="flex-1 relative bg-white overflow-hidden">
            <div id="contacts-loading" class="absolute inset-0 flex flex-col items-center justify-center text-slate-300 z-10 bg-white">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-indigo-500"></i>
                <span class="text-[10px] font-black uppercase tracking-tighter">Синхронизация</span>
            </div>
            <div class="h-full overflow-y-auto custom-scrollbar" id="chat-list"></div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-[#E5E5EA] relative overflow-hidden">
        <!-- Header -->
        <header id="chat-header" class="bg-white/95 backdrop-blur p-3 px-4 border-b border-slate-200 flex items-center justify-between shadow-sm z-10 hidden">
            <div class="flex items-center gap-3">
                <button class="md:hidden p-2 text-slate-400 hover:text-indigo-600" onclick="closeChatMobile()"><i class="fas fa-chevron-left text-lg"></i></button>
                <img id="active-chat-avatar" src="" class="w-10 h-10 rounded-xl object-cover bg-slate-200 ring-2 ring-slate-50">
                <div class="min-w-0">
                    <h3 id="active-chat-name" class="font-black text-sm truncate max-w-[180px]">Чат</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                        <p class="text-[9px] text-green-600 font-black uppercase tracking-widest">онлайн</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-1 items-center">
                <button class="p-2.5 text-slate-400 hover:text-green-600 hover:bg-green-50 rounded-xl transition-all" onclick="startCall('audio')"><i class="fas fa-phone-alt"></i></button>
                <button class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" onclick="startCall('video')"><i class="fas fa-video"></i></button>
                <div class="w-px h-6 bg-slate-200 mx-1"></div>
                <button class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all" onclick="clearChatHistory()"><i class="fas fa-trash-alt"></i></button>
            </div>
        </header>

        <!-- Messages container -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar hidden relative"></div>

        <!-- Empty state -->
        <div id="empty-state" class="flex-1 flex flex-col items-center justify-center bg-slate-50">
            <div class="w-24 h-24 bg-white rounded-[2rem] flex items-center justify-center text-indigo-500 mb-6 shadow-2xl border border-slate-100 rotate-6 hover:rotate-0 transition-transform duration-500">
                <i class="fas fa-bolt text-4xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-1 tracking-tighter">PULSE MESSENGER</h2>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Выберите диалог для начала</p>
        </div>

        <!-- Chat Input -->
        <footer id="chat-input-area" class="bg-white p-3 border-t border-slate-100 hidden">
            <div class="max-w-5xl mx-auto flex items-end gap-3">
                <div class="flex-1 bg-slate-50 rounded-2xl p-1.5 flex items-end border border-slate-200 focus-within:border-indigo-400 transition-all shadow-inner relative">
                    <button class="p-2.5 text-slate-400 hover:text-indigo-600" onclick="triggerFileInput()"><i class="fas fa-paperclip"></i></button>
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileSelect(event)">
                    
                    <textarea id="message-input" rows="1" placeholder="Напишите что-нибудь..." class="w-full bg-transparent border-none focus:ring-0 py-2.5 px-2 text-sm outline-none resize-none max-h-40 font-medium" oninput="resizeTextarea(this)"></textarea>
                    
                    <div class="flex items-center">
                        <button id="cancel-voice-btn" class="hidden p-2.5 text-slate-400 hover:text-slate-600 transition-all" onclick="cancelVoiceRecording()">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                        <button id="voice-btn" class="p-2.5 text-slate-400 hover:text-red-500 transition-all" onclick="toggleVoiceRecording()">
                            <i class="fas fa-microphone" id="voice-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button id="send-btn" class="p-4 bg-indigo-600 text-white rounded-2xl flex items-center justify-center disabled:opacity-50 shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95" onclick="sendMessage()" disabled>
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>
            <!-- Attachment Preview -->
            <div id="file-preview-area" class="hidden mt-3 p-3 bg-indigo-50 rounded-2xl flex justify-between items-center border border-indigo-100 max-w-5xl mx-auto">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-200 rounded-lg flex items-center justify-center"><i class="fas fa-image text-indigo-600"></i></div>
                    <span id="file-name" class="text-xs font-black text-indigo-700 truncate">image.png</span>
                </div>
                <button onclick="clearFileAttachment()" class="p-1.5 text-red-400 hover:text-red-600"><i class="fas fa-times-circle text-xl"></i></button>
            </div>
        </footer>
    </main>
</div>

<!-- Call Screen -->
<div id="call-overlay" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center text-white overflow-hidden">
    <div id="call-bg-container" class="call-bg bg-gradient-default"></div>
    <div class="vignette"></div>
    
    <div id="call-info" class="absolute top-24 flex flex-col items-center z-10 transition-all">
        <img id="call-avatar" src="" class="w-28 h-28 rounded-[2rem] border-4 border-white/10 mb-6 object-cover shadow-2xl">
        <h2 id="call-name" class="text-4xl font-black text-white drop-shadow-2xl italic tracking-tighter">Имя...</h2>
        <div id="call-timer" class="text-sm font-black text-indigo-200 mt-4 bg-white/10 px-4 py-1.5 rounded-full backdrop-blur-xl border border-white/10 hidden tracking-widest">00:00</div>
        <p id="call-status" class="text-indigo-400 font-black mt-3 uppercase tracking-[0.3em] text-[10px] opacity-80">Вызов...</p>
    </div>
    
    <div id="video-container" class="w-full h-full hidden relative flex items-center justify-center overflow-hidden z-0">
        <div class="w-full h-full bg-slate-950/80 backdrop-blur-3xl flex items-center justify-center">
             <i class="fas fa-user-astronaut text-[120px] text-white/5" id="video-placeholder"></i>
             <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
        </div>
        <video id="local-video" autoplay playsinline muted class="absolute bottom-36 right-8 w-40 h-60 object-cover rounded-[2.5rem] border-4 border-white/20 shadow-2xl z-20"></video>
    </div>

    <div class="absolute bottom-12 flex gap-5 z-30">
        <button id="accept-call" class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center shadow-2xl hover:bg-green-600 transition-all scale-125 hidden animate-bounce" onclick="answerCall()"><i class="fas fa-phone text-2xl"></i></button>
        <button id="toggle-mic" class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center hover:bg-white/20 transition-all hidden" onclick="toggleMic()"><i class="fas fa-microphone text-xl" id="mic-icon"></i></button>
        <button id="toggle-bg" class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center hover:bg-white/20 transition-all hidden" onclick="nextCallBackground()"><i class="fas fa-mountain text-xl"></i></button>
        <button class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center shadow-2xl hover:bg-red-600 transition-all active:rotate-90" onclick="endCall()"><i class="fas fa-phone-slash text-2xl"></i></button>
        <button id="toggle-cam" class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center hover:bg-white/20 transition-all hidden" onclick="toggleCamera()"><i class="fas fa-video text-xl" id="cam-icon"></i></button>
    </div>
</div>

<!-- Modals -->
<div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="settings-modal" class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-10 hidden border border-slate-100">
        <h3 class="font-black text-3xl mb-8 text-slate-800 italic tracking-tighter">Настройки</h3>
        <div class="flex flex-col items-center mb-10">
            <div class="relative group cursor-pointer" onclick="triggerAvatarInput()">
                <img id="settings-avatar" src="" class="w-32 h-28 rounded-[2.5rem] mb-2 border-8 border-slate-50 group-hover:border-indigo-100 object-cover transition-all shadow-xl -rotate-2 group-hover:rotate-0">
                <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-[2.5rem] opacity-0 group-hover:opacity-100 transition-opacity text-white text-3xl"><i class="fas fa-camera-retro"></i></div>
            </div>
            <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="handleAvatarSelect(event)">
            <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mt-4">Кликните чтобы сменить фото</p>
        </div>
        <div class="space-y-6">
            <input type="text" id="settings-name" placeholder="Ваше имя" class="w-full p-5 bg-slate-50 border-none rounded-2xl outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all font-black text-lg">
            <input type="text" id="settings-status" placeholder="О себе" class="w-full p-5 bg-slate-50 border-none rounded-2xl outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all font-bold">
        </div>
        <div class="flex justify-between items-center mt-12">
            <button onclick="signOut()" class="text-red-500 font-black text-xs uppercase tracking-widest hover:underline">Выйти из аккаунта</button>
            <div class="flex gap-3">
                <button onclick="closeModals()" class="px-6 py-4 text-slate-400 font-black text-xs uppercase">Отмена</button>
                <button onclick="saveSettings()" class="px-10 py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-xl shadow-indigo-100 active:scale-95">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="new-chat-modal" class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-10 hidden">
        <h3 class="font-black text-3xl mb-6 text-slate-800 italic tracking-tighter">Найти Pulse</h3>
        <div class="relative mb-8">
            <input type="text" id="new-chat-target" placeholder="ID пользователя..." class="w-full p-5 bg-slate-50 border-none rounded-[1.5rem] outline-none focus:ring-4 focus:ring-indigo-500/10 font-mono text-sm shadow-inner">
            <button class="absolute right-3 top-3 p-3 bg-indigo-600 text-white rounded-xl shadow-lg" onclick="startNewChat()"><i class="fas fa-search"></i></button>
        </div>
        <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-4 ml-1">Недавно в сети</p>
        <div class="bg-slate-50 rounded-2xl p-2 mb-8 max-h-60 overflow-y-auto custom-scrollbar" id="demo-users-list"></div>
        <div class="text-center">
            <button onclick="closeModals()" class="text-slate-400 text-[10px] font-black uppercase tracking-widest hover:text-slate-600">Закрыть</button>
        </div>
    </div>
</div>

<div id="toast-container" class="fixed top-8 right-8 z-[110] pointer-events-none flex flex-col gap-3"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDBgLPC4AD-nXVNsNUpC_2Hw2HjP4OU_7k",
        authDomain: "chatify-ae9cf.firebaseapp.com",
        projectId: "chatify-ae9cf",
        storageBucket: "chatify-ae9cf.firebasestorage.app",
        messagingSenderId: "876044336811",
        appId: "1:876044336811:web:c2f398533c519c75e201ee"
    };

    const appId = 'pulse-v11-ultra';
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const callBackgrounds = [
        { name: 'Default', url: '', class: 'bg-gradient-default' },
        { name: 'Office', url: 'https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1200' },
        { name: 'Space', url: 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1200' },
        { name: 'Mountains', url: 'https://images.unsplash.com/photo-1500673922987-e212871fec22?q=80&w=1200' },
        { name: 'Privacy', url: '', class: 'bg-slate-900', blur: true }
    ];

    const state = {
        currentUser: null,
        userProfile: null,
        activeChatId: null,
        activeChatInfo: null,
        chats: [],
        usersMap: {},
        mediaRecorder: null,
        audioChunks: [],
        isRecording: false,
        isCancelledVoice: false, // Флаг отмены
        localStream: null,
        remoteStream: null,
        peerConnection: null,
        currentCallId: null,
        camEnabled: true,
        micEnabled: true,
        bgIndex: 0,
        callInterval: null,
        callSeconds: 0,
        attachedFile: null,
        tempAvatar: null,
        servers: { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] }
    };

    const els = {
        chatList: document.getElementById('chat-list'),
        contactsLoading: document.getElementById('contacts-loading'),
        messagesContainer: document.getElementById('messages-container'),
        messageInput: document.getElementById('message-input'),
        sendBtn: document.getElementById('send-btn'),
        chatHeader: document.getElementById('chat-header'),
        activeChatName: document.getElementById('active-chat-name'),
        activeChatAvatar: document.getElementById('active-chat-avatar'),
        modalOverlay: document.getElementById('modal-overlay'),
        callOverlay: document.getElementById('call-overlay'),
        localVideo: document.getElementById('local-video'),
        remoteVideo: document.getElementById('remote-video'),
        callStatus: document.getElementById('call-status'),
        callTimer: document.getElementById('call-timer'),
        micIcon: document.getElementById('mic-icon'),
        camIcon: document.getElementById('cam-icon'),
        callBg: document.getElementById('call-bg-container'),
        cancelVoiceBtn: document.getElementById('cancel-voice-btn')
    };

    // --- Init ---
    async function initAuth() {
        try { await auth.signInAnonymously(); } catch (e) { showToast("Ошибка сети", "error"); }
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            state.currentUser = user;
            await initUserProfile(user);
            listenForChats();
            listenForCalls();
        }
    });

    async function initUserProfile(user) {
        const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(user.uid);
        const doc = await ref.get();
        if (doc.exists) {
            state.userProfile = doc.data();
        } else {
            state.userProfile = { uid: user.uid, name: "USER_" + user.uid.substring(0,4), avatar: "https://ui-avatars.com/api/?name=User&background=random", status: "Active" };
            await ref.set(state.userProfile);
        }
        updateMyUI();
    }

    function updateMyUI() {
        document.getElementById('my-name').textContent = state.userProfile.name;
        document.getElementById('my-avatar').src = state.userProfile.avatar;
        document.getElementById('settings-avatar').src = state.userProfile.avatar;
        document.getElementById('settings-name').value = state.userProfile.name;
        document.getElementById('settings-status').value = state.userProfile.status;
    }

    // --- Chats ---
    function listenForChats() {
        db.collection('artifacts').doc(appId).collection('users').doc(state.currentUser.uid).collection('chats')
          .onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({id: doc.id, ...doc.data()}));
            state.chats = list.sort((a,b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
            renderChatList();
        });
    }

    async function renderChatList(filter = "") {
        els.chatList.innerHTML = '';
        for (const chat of state.chats) {
            const otherUid = chat.participants.find(p => p !== state.currentUser.uid);
            if (!state.usersMap[otherUid]) {
                const uDoc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(otherUid).get();
                state.usersMap[otherUid] = uDoc.data() || {name: 'Anonymous', avatar: ''};
            }
            const user = state.usersMap[otherUid];
            if (filter && !user.name.toLowerCase().includes(filter.toLowerCase())) continue;

            const div = document.createElement('div');
            div.className = `p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-all border-b border-slate-50 ${state.activeChatId === chat.id ? 'bg-indigo-50 border-l-[6px] border-indigo-600' : 'border-l-[6px] border-transparent'}`;
            div.onclick = () => selectChat(chat.id, otherUid);
            div.innerHTML = `
                <img src="${user.avatar}" class="w-14 h-14 rounded-[1.2rem] object-cover shadow-sm">
                <div class="flex-1 min-w-0">
                    <div class="font-black text-sm text-slate-800 truncate">${escapeHtml(user.name)}</div>
                    <div class="text-[11px] font-bold text-slate-400 truncate mt-1">${escapeHtml(chat.lastMessage || '...')}</div>
                </div>`;
            els.chatList.appendChild(div);
        }
        if (els.contactsLoading) els.contactsLoading.classList.add('hidden');
    }

    function selectChat(chatId, otherUid) {
        state.activeChatId = chatId;
        state.activeChatInfo = state.usersMap[otherUid];
        state.activeChatInfo.uid = otherUid;
        document.getElementById('empty-state').classList.add('hidden');
        els.chatHeader.classList.remove('hidden');
        els.messagesContainer.classList.remove('hidden');
        document.getElementById('chat-input-area').classList.remove('hidden');
        els.activeChatName.textContent = state.activeChatInfo.name;
        els.activeChatAvatar.src = state.activeChatInfo.avatar;
        renderChatList();
        listenForMessages(chatId);
        if (window.innerWidth <= 768) closeChatMobile();
    }

    function listenForMessages(chatId) {
        if (state.unsubscribeMessages) state.unsubscribeMessages();
        state.unsubscribeMessages = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat_rooms').doc(chatId).collection('messages')
          .orderBy('timestamp', 'asc').onSnapshot(snap => {
            els.messagesContainer.innerHTML = '';
            snap.forEach(doc => renderMessage(doc.data(), doc.id));
            scrollToBottom();
        });
    }

    function renderMessage(msg, id) {
        const isMine = msg.senderId === state.currentUser.uid;
        const div = document.createElement('div');
        div.className = `flex ${isMine ? 'justify-end' : 'justify-start'} mb-4 group message-bubble`;
        let content = '';
        if (msg.type === 'image') content = `<img src="${msg.fileUrl}" class="rounded-[1.5rem] max-h-72 mb-1 shadow-2xl border-4 border-white cursor-pointer" onclick="window.open('${msg.fileUrl}')">`;
        if (msg.type === 'voice') content = `<div class="flex items-center gap-3 bg-white/10 p-2 rounded-xl mb-1"><i class="fas fa-play text-indigo-400"></i><audio controls class="max-w-[200px] h-8 brightness-90 contrast-125"><source src="${msg.fileUrl}" type="audio/webm"></audio></div>`;
        if (msg.text) content += `<p class="text-[14px] leading-relaxed font-semibold">${escapeHtml(msg.text)}</p>`;
        div.innerHTML = `
            <div class="relative flex items-center gap-2">
                ${isMine ? `<button onclick="deleteMessage('${id}')" class="opacity-0 group-hover:opacity-100 p-2 text-red-400 hover:text-red-600 transition-all"><i class="fas fa-trash-alt text-xs"></i></button>` : ''}
                <div class="max-w-xs md:max-w-md p-3.5 px-6 rounded-[1.8rem] shadow-sm ${isMine ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 rounded-bl-none border border-slate-100'}">
                    ${content}
                    <div class="text-[9px] mt-2 opacity-50 text-right font-black uppercase tracking-widest">${msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</div>
                </div>
            </div>`;
        els.messagesContainer.appendChild(div);
    }

    async function pushMessage(msgData) {
        const chatId = state.activeChatId;
        const otherUid = state.activeChatInfo.uid;
        const finalData = { ...msgData, senderId: state.currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() };
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat_rooms').doc(chatId).collection('messages').add(finalData);
        const preview = msgData.text || (msgData.type === 'image' ? '[Фото]' : '🎤 Голосовое');
        const update = { lastMessage: preview, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), participants: [state.currentUser.uid, otherUid] };
        await db.collection('artifacts').doc(appId).collection('users').doc(state.currentUser.uid).collection('chats').doc(chatId).set(update, {merge:true});
        await db.collection('artifacts').doc(appId).collection('users').doc(otherUid).collection('chats').doc(chatId).set(update, {merge:true});
        clearFileAttachment();
    }

    // --- Voice Logic (WITH CANCEL) ---
    async function toggleVoiceRecording() {
        if (!state.isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/ogg';
                
                state.mediaRecorder = new MediaRecorder(stream, { mimeType });
                state.audioChunks = [];
                state.isCancelledVoice = false;
                
                state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
                
                state.mediaRecorder.onstop = () => {
                    if (state.isCancelledVoice) {
                        state.audioChunks = [];
                        return;
                    }
                    const blob = new Blob(state.audioChunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.onload = async () => {
                        const base64 = reader.result;
                        if (base64.length < 100) return;
                        await pushMessage({ type: 'voice', fileUrl: base64 });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                document.getElementById('voice-icon').className = 'fas fa-stop text-red-500 recording-pulse';
                els.cancelVoiceBtn.classList.remove('hidden'); // Показать отмену
                showToast("Идет запись...", "info");
            } catch (e) { showToast("Нет доступа к микрофону!", "error"); }
        } else {
            state.mediaRecorder.stop();
            state.isRecording = false;
            document.getElementById('voice-icon').className = 'fas fa-microphone';
            els.cancelVoiceBtn.classList.add('hidden'); // Скрыть отмену
        }
    }

    function cancelVoiceRecording() {
        if (state.isRecording && state.mediaRecorder) {
            state.isCancelledVoice = true;
            state.mediaRecorder.stop();
            state.isRecording = false;
            document.getElementById('voice-icon').className = 'fas fa-microphone';
            els.cancelVoiceBtn.classList.add('hidden');
            showToast("Запись отменена", "info");
        }
    }

    async function sendMessage() {
        const text = els.messageInput.value.trim();
        if (!text && !state.attachedFile) return;
        const msg = { text, type: state.attachedFile ? 'image' : 'text', fileUrl: state.attachedFile?.dataUrl || null };
        els.messageInput.value = ''; els.messageInput.style.height = 'auto';
        await pushMessage(msg);
    }

    // --- WebRTC ---
    async function createPeerConnection(video) {
        if (state.peerConnection) state.peerConnection.close();
        state.peerConnection = new RTCPeerConnection(state.servers);
        state.localStream = await navigator.mediaDevices.getUserMedia({ audio: {echoCancellation: true}, video: video });
        state.localStream.getTracks().forEach(track => state.peerConnection.addTrack(track, state.localStream));
        state.peerConnection.ontrack = (e) => {
            if (!state.remoteStream) { state.remoteStream = new MediaStream(); els.remoteVideo.srcObject = state.remoteStream; }
            state.remoteStream.addTrack(e.track);
            els.remoteVideo.classList.remove('hidden');
            document.getElementById('video-placeholder').classList.add('hidden');
            els.remoteVideo.play();
        };
        els.localVideo.srcObject = state.localStream;
        document.getElementById('video-container').classList.remove('hidden');
        ['toggle-cam','toggle-mic','toggle-bg'].forEach(id => document.getElementById(id).classList.remove('hidden'));
        state.micEnabled = true; state.camEnabled = true; updateControlsIcons();
    }

    async function startCall(type) {
        const callId = "call_" + Date.now();
        state.currentCallId = callId;
        showCallUI(state.activeChatInfo, "ПОИСК...", type);
        try {
            await createPeerConnection(type === 'video');
            const offer = await state.peerConnection.createOffer();
            await state.peerConnection.setLocalDescription(offer);
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).set({
                callerId: state.currentUser.uid, callerName: state.userProfile.name, callerAvatar: state.userProfile.avatar,
                receiverId: state.activeChatInfo.uid, type: type, status: 'offering', offer: { sdp: offer.sdp, type: offer.type },
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            state.peerConnection.onicecandidate = (e) => { if (e.candidate) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).collection('callerCandidates').add(e.candidate.toJSON()); };
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).onSnapshot(async (doc) => {
                const data = doc.data();
                if (data?.answer && !state.peerConnection.currentRemoteDescription) { await state.peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer)); startCallTimer(); }
                if (data?.status === 'ended') endCallUI();
            });
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).collection('answerCandidates').onSnapshot(snap => { snap.docChanges().forEach(change => { if (change.type === 'added') state.peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
        } catch(e) { endCallUI(); }
    }

    async function answerCall() {
        document.getElementById('accept-call').classList.add('hidden');
        els.callStatus.textContent = "СОЕДИНЕНИЕ...";
        const callId = state.currentCallId;
        const callDoc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).get();
        const callData = callDoc.data();
        try {
            await createPeerConnection(callData.type === 'video');
            state.peerConnection.onicecandidate = (e) => { if (e.candidate) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).collection('answerCandidates').add(e.candidate.toJSON()); };
            await state.peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answer = await state.peerConnection.createAnswer();
            await state.peerConnection.setLocalDescription(answer);
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).update({ answer: { sdp: answer.sdp, type: answer.type }, status: 'accepted' });
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(callId).collection('callerCandidates').onSnapshot(snap => { snap.docChanges().forEach(change => { if (change.type === 'added') state.peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
            startCallTimer();
        } catch(e) { endCall(); }
    }

    function listenForCalls() {
        db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls')
          .where('receiverId', '==', state.currentUser.uid).onSnapshot(snap => {
            snap.forEach(doc => {
                const call = doc.data();
                if (call.status === 'offering' && state.currentCallId !== doc.id) {
                    state.currentCallId = doc.id;
                    showCallUI({name: call.callerName, avatar: call.callerAvatar}, "ВХОДЯЩИЙ ВЫЗОВ", call.type);
                    document.getElementById('accept-call').classList.remove('hidden');
                }
                if (call.status === 'ended' && state.currentCallId === doc.id) endCallUI();
            });
        });
    }

    // --- Helpers ---
    function nextCallBackground() {
        state.bgIndex = (state.bgIndex + 1) % callBackgrounds.length;
        const bg = callBackgrounds[state.bgIndex];
        els.callBg.className = 'call-bg';
        els.localVideo.classList.remove('video-blur', 'video-studio');
        if (bg.url) { els.callBg.style.backgroundImage = `url(${bg.url})`; els.localVideo.classList.add('video-studio'); } 
        else { els.callBg.style.backgroundImage = 'none'; if (bg.class) els.callBg.classList.add(bg.class); }
        if (bg.blur) els.localVideo.classList.add('video-blur');
        showToast("Фон: " + bg.name, "info");
    }

    function startCallTimer() {
        els.callStatus.textContent = "В РАЗГОВОРЕ";
        els.callTimer.classList.remove('hidden');
        state.callSeconds = 0;
        state.callInterval = setInterval(() => {
            state.callSeconds++;
            const m = Math.floor(state.callSeconds / 60).toString().padStart(2, '0');
            const s = (state.callSeconds % 60).toString().padStart(2, '0');
            els.callTimer.textContent = `${m}:${s}`;
        }, 1000);
    }

    function endCallUI() {
        if (state.callInterval) clearInterval(state.callInterval);
        if (state.localStream) state.localStream.getTracks().forEach(t => t.stop());
        if (state.peerConnection) state.peerConnection.close();
        els.callOverlay.classList.add('hidden');
        els.callTimer.classList.add('hidden');
        document.getElementById('video-container').classList.add('hidden');
        state.currentCallId = null;
    }

    async function endCall() {
        if (state.currentCallId) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('calls').doc(state.currentCallId).update({ status: 'ended' });
        endCallUI();
    }

    function toggleMic() { if (state.localStream) { state.micEnabled = !state.micEnabled; state.localStream.getAudioTracks().forEach(t => t.enabled = state.micEnabled); updateControlsIcons(); } }
    function toggleCamera() { if (state.localStream) { state.camEnabled = !state.camEnabled; state.localStream.getVideoTracks().forEach(t => t.enabled = state.camEnabled); updateControlsIcons(); } }
    function updateControlsIcons() {
        els.micIcon.className = `fas fa-microphone${state.micEnabled ? '' : '-slash'} text-xl`;
        els.camIcon.className = `fas fa-video${state.camEnabled ? '' : '-slash'} text-xl`;
    }

    function showToast(m, t) {
        const d = document.createElement('div');
        d.className = `p-4 rounded-2xl text-white text-[11px] font-black uppercase tracking-tighter shadow-2xl transition-all ${t === 'error' ? 'bg-red-500' : 'bg-indigo-600'}`;
        d.innerHTML = m;
        document.getElementById('toast-container').appendChild(d);
        setTimeout(() => d.remove(), 3000);
    }

    function showSettingsModal() { els.modalOverlay.classList.remove('hidden'); document.getElementById('settings-modal').classList.remove('hidden'); document.getElementById('new-chat-modal').classList.add('hidden'); }
    function showNewChatModal() { els.modalOverlay.classList.remove('hidden'); document.getElementById('new-chat-modal').classList.remove('hidden'); document.getElementById('settings-modal').classList.add('hidden'); fetchUsers(); }
    function closeModals() { els.modalOverlay.classList.add('hidden'); }
    function closeChatMobile() { els.sidebar.classList.add('sidebar-open'); els.sidebar.classList.remove('sidebar-closed'); }
    function resizeTextarea(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; els.sendBtn.disabled = el.value.trim() === '' && !state.attachedFile; }
    function scrollToBottom() { els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight; }
    function triggerFileInput() { document.getElementById('file-input').click(); }
    function triggerAvatarInput() { document.getElementById('avatar-input').click(); }
    function handleFileSelect(e) {
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = () => { state.attachedFile = { dataUrl: r.result, name: f.name }; document.getElementById('file-preview-area').classList.remove('hidden'); document.getElementById('file-name').textContent = f.name; els.sendBtn.disabled = false; };
        r.readAsDataURL(f);
    }
    function handleAvatarSelect(e) {
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = () => { state.tempAvatar = r.result; document.getElementById('settings-avatar').src = r.result; };
        r.readAsDataURL(f);
    }
    function clearFileAttachment() { state.attachedFile = null; document.getElementById('file-preview-area').classList.add('hidden'); }
    async function saveSettings() {
        const name = document.getElementById('settings-name').value.trim();
        const status = document.getElementById('settings-status').value.trim();
        const update = { name, status };
        if (state.tempAvatar) update.avatar = state.tempAvatar;
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(state.currentUser.uid).update(update);
        state.userProfile = { ...state.userProfile, ...update };
        updateMyUI(); closeModals();
    }
    async function startNewChat() {
        const tid = document.getElementById('new-chat-target').value.trim();
        if (!tid || tid === state.currentUser.uid) return;
        const uids = [state.currentUser.uid, tid].sort();
        const cid = `room_${uids[0]}_${uids[1]}`;
        await db.collection('artifacts').doc(appId).collection('users').doc(state.currentUser.uid).collection('chats').doc(cid).set({ participants: [state.currentUser.uid, tid], updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
        closeModals(); selectChat(cid, tid);
    }
    async function fetchUsers() {
        const list = document.getElementById('demo-users-list');
        const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').limit(15).get();
        list.innerHTML = '';
        snap.forEach(doc => {
            const u = doc.data(); if (u.uid === state.currentUser.uid) return;
            const d = document.createElement('div');
            d.className = "p-3 hover:bg-white rounded-2xl cursor-pointer flex justify-between items-center mb-1 transition-all border border-transparent hover:border-slate-100";
            d.onclick = () => document.getElementById('new-chat-target').value = u.uid;
            d.innerHTML = `<div class="flex items-center gap-3"><img src="${u.avatar}" class="w-10 h-10 rounded-xl shadow-sm"> <span class="font-black text-xs uppercase">${u.name}</span></div><i class="fas fa-arrow-right text-indigo-500"></i>`;
            list.appendChild(d);
        });
    }

    function signOut() { auth.signOut(); window.location.reload(); }
    function showCallUI(user, status, type) { els.callOverlay.classList.remove('hidden'); document.getElementById('call-avatar').src = user.avatar; document.getElementById('call-name').textContent = user.name; els.callStatus.textContent = status; }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    async function deleteMessage(msgId) { try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat_rooms').doc(state.activeChatId).collection('messages').doc(msgId).delete(); } catch(e) {} }
    async function clearChatHistory() { if (confirm("Очистить?")) { const snap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat_rooms').doc(state.activeChatId).collection('messages').get(); const b = db.batch(); snap.forEach(d => b.delete(d.ref)); await b.commit(); } }

    window.onload = initAuth;
</script>
